# Netlify configuration
#
# The site itself is still served by GitHub Pages. This config exists only
# so Netlify builds and hosts the three payment functions under /api/*.
# Nothing here publishes the static site.

[build]
  functions = "netlify/functions"
  publish = "."
  # No build step: the site is plain HTML, CSS and JS.

[functions]
  node_bundler = "esbuild"

# /api/checkout            -> netlify/functions/checkout.js
# /api/verify-session      -> netlify/functions/verify-session.js
# /api/stripe-webhook      -> netlify/functions/stripe-webhook.js
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# NOTE: CORS is set by the functions themselves, from SITE_URL, not here.
#
# A blanket [[headers]] block on /api/* would also land on webhook responses,
# and having a second copy of Access-Control-Allow-Origin alongside the one
# the function returns can produce a duplicated header, which browsers reject.
# The functions are the single source of truth: change SITE_URL, not this file.
